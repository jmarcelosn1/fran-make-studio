name: Quality
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
      - run: npm run security
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
            coverage/
          retention-days: 14
